[package]
name = "nine-innings-runtime"
version = "0.1.0"
edition = "2021"
[dependencies]
miniz_oxide = "0.8"
sha2 = "0.10"
touchhle-arm-interpreter = { path = "../vendor/touchhle-arm-interpreter" }
[[bin]]
name = "engine-startup"
path = "src/bin/engine-startup.rs"

[[bin]]
name = "apk-tables"
path = "src/bin/apk-tables.rs"

[profile.release]
opt-level = 3
lto = "thin"

